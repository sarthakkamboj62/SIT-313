<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>BMI Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Main Container -->
    <div class="max-w-md mx-auto mt-6 sm:mt-10 px-4 text-left">

        <!-- Heading -->
        <h1 class="text-center text-xl sm:text-2xl md:text-3xl lg:text-4xl 
                   font-bold text-blue-600">
            What is my BMI?
        </h1>

        <!-- Weight -->
        <p class="mt-5 text-sm sm:text-base md:text-lg">
            Please enter your weight (kg)
        </p>

        <input 
            type="number" 
            id="weight"
            class="border border-gray-400 p-2 sm:p-3 
                   w-full text-sm sm:text-base rounded"
        >

        <!-- Height -->
        <p class="mt-5 text-sm sm:text-base md:text-lg">
            Please enter your height (m)
        </p>

        <input 
            type="number" 
            id="height"
            class="border border-gray-400 p-2 sm:p-3 
                   w-full text-sm sm:text-base rounded"
        >

        <!-- Button -->
        <div class="text-center mt-5">
            <button 
                onclick="calculateBMI()"
                class="bg-blue-500 hover:bg-blue-600 text-white
                       px-4 py-2 sm:px-6 sm:py-3
                       text-sm sm:text-base md:text-lg
                       rounded"
            >
                Calculate
            </button>
        </div>

        <!-- BMI Result -->
        <div 
            id="result"
            class="bg-blue-500 text-white
                   p-3 sm:p-4 md:p-5
                   mt-5 w-full
                   text-center
                   text-sm sm:text-base md:text-lg
                   rounded"
        >
            Your BMI will appear here
        </div>

    </div>

    <script>
        function calculateBMI() {

            let weight = document.getElementById("weight").value;
            let height = document.getElementById("height").value;

            if (weight == "" || height == "") {
                document.getElementById("result").innerHTML =
                    "Please enter weight and height";
                return;
            }

            let bmi = weight / (height * height);

            let category = "";

            if (bmi < 18.5) {
                category = "Underweight";
            }
            else if (bmi < 25) {
                category = "Normal";
            }
            else if (bmi < 30) {
                category = "Overweight";
            }
            else {
                category = "Obese";
            }

            document.getElementById("result").innerHTML =
                "BMI is " + bmi.toFixed(2) + "<br>" + category;
        }
    </script>

</body>
</html>
